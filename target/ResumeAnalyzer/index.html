<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Resume Analyzer</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <div class="container">

        <div class="card">

            <h1>Resume Analyzer</h1>

            <p>
                Analyze your resume according to the job requirements
            </p>

            <form action="analyze"
                  method="post"
                  enctype="multipart/form-data">

                <label>Upload Resume</label>

                <input type="file"
                       name="resume"
                       accept=".pdf"
                       required>

                <label>Job Description</label>

                <textarea name="jobDescription"
                          placeholder="Paste job description here..."
                          required></textarea>

                <button type="submit">
                    Analyze Resume
                </button>

            </form>

        </div>

    </div>

</body>

</html>
